      h += '<span class="star' + cls + '" data-i="' + i + '">' + I("stella") + I("stella", "s-fill") + "</span>";
    }
    return h;
  }

  /* stato del voto in corso: le stelle preparano una "bozza",
     il salvataggio avviene solo con «Conferma voto» */
  function statoVoto(p) {
    if (bozza != null && bozza !== p.voto) return '<p class="rating-state pending">Non ancora confermato</p>';
    if (p.voto != null) return '<p class="rating-state">Voto salvato</p>';
    return '<p class="rating-state">Tocca o trascina sulle stelle, poi conferma</p>';
  }

  function bloccoVoto(t, p) {
    if (EN.ui.bloccato(t)) return "";
    var v = bozza != null ? bozza : p.voto;
    return '<section class="rating" aria-labelledby="voto-h">' +
      '<div class="rating-head"><h3 id="voto-h">Il mio voto</h3>' +
      '<div class="rating-value" aria-live="polite">' +
      (v == null ? '<b class="none">—</b>' : '<b class="num">' + U.fmtVoto(v) + "</b><small>/ 10</small>") +
      "</div></div>" +
      '<div class="rating-word" data-parola>' + U.parolaVoto(v) + "</div>" +
      '<div class="stars" role="slider" tabindex="0" aria-label="Il mio voto da 1 a 10" aria-valuemin="1" aria-valuemax="10" aria-valuenow="' + (v == null ? 0 : v) +
      '" aria-valuetext="' + (v == null ? "Nessun voto" : U.fmtVoto(v) + " su 10, " + U.parolaVoto(v)) + '">' + stelle(v) + "</div>" +
      '<div class="rating-scale"><span>1</span><span>5</span><span>10</span></div>' +
      '<div class="rating-actions">' +
      '<button class="step" data-step="-0.5" aria-label="Togli mezzo punto">−</button>' +
      '<button class="step" data-step="0.5" aria-label="Aggiungi mezzo punto">+</button>' +
      (p.voto != null ? '<button class="link-btn" data-del-voto>Elimina voto</button>' : '<span class="rating-hint">Mezza stella = mezzo punto</span>') +
      "</div>" +
      '<button class="btn btn-gold" data-conferma-voto' + (v == null ? " disabled" : "") + ">" + I("check") + "Conferma voto</button>" +
      '<div data-stato-voto>' + statoVoto(p) + "</div>" +
      "</section>";
  }

  function bloccoVisto(t, p) {
    if (EN.ui.bloccato(t)) {
      var g = U.giorniA(EN.config.dataObiettivo);
      return '<div class="lock-note">' + I("lucchetto") + "<span>Si sblocca il 16 dicembre 2026 (mancano " + g + (g === 1 ? " giorno" : " giorni") + ").</span></div>";
    }
    return '<div class="seen-row">' +
      (p.visto
        ? '<button class="btn btn-seen" data-seen="0">' + I("check") + "Visto! Tocca per annullare</button>" +
          (p.vistoIl ? '<div class="seen-when">Segnato come visto il ' + U.fmtData(p.vistoIl) + "</div>" : "")
        : '<button class="btn btn-red" data-seen="1">' + I("check") + "Segna come visto</button>") +
      "</div>";
  }

  function contenuto(t) {
    var p = EN.progressi.di(t.id);
    var cat = EN.catalogo.titoli;
    var prec = cat[t.n - 2], succ = cat[t.n];
    var rt = t.rt != null
      ? '<div class="rt-box"><div class="rt-main"><span aria-hidden="true">🍅</span><span>Rotten Tomatoes:</span><span class="rt-score num">' + t.rt + "%</span></div>" +
        '<a class="rt-link" href="' + linkRT(t) + '" target="_blank" rel="noopener">Vedi su Rotten Tomatoes ' + I("esterno") + "</a>" +
        '<div class="rt-sub" style="flex-basis:100%">' + U.esc(EN.catalogo.fontiRT[t.rtFonte] || "") + "</div></div>"
      : '<div class="rt-box"><div class="rt-main"><span aria-hidden="true">🍅</span><span>Rotten Tomatoes: non disponibile</span></div>' +
        '<div class="rt-sub" style="flex-basis:100%">' + U.esc(t.rtNota || "") + "</div></div>";

    return '<div class="sheet-art" aria-hidden="true">' + EN.ui.copertina(t, { decorativa: true }) + "</div>" +
      '<span class="sheet-grab" aria-hidden="true"></span>' +
      '<button class="sheet-close" data-close aria-label="Chiudi la scheda">' + I("chiudi") + "</button>" +
      '<div class="sheet-head"><div class="sheet-poster">' + EN.ui.copertina(t, { grande: true, subito: true }) + "</div>" +
      '<div class="sheet-heading"><span class="sheet-n">' + (t.finale ? "N° 41 · Il gran finale" : "N° " + t.n + " di 40 nella maratona") + "</span>" +
      '<h2 class="sheet-title" id="sheet-title">' + U.esc(t.titolo) + "</h2></div></div>" +
      '<div class="sheet-body">' +
      '<div class="sheet-meta">' + EN.ui.pillole(t) + "</div>" +
      '<p class="sheet-plot">' + U.esc(t.trama) + "</p>" +
      rt +
      bloccoVoto(t, p) +
      bloccoVisto(t, p) +
      '<nav class="sheet-nav" aria-label="Titoli vicini">' +
      (prec ? '<button data-open="' + prec.id + '">' + I("sx") + "<span>" + prec.n + ". " + U.esc(prec.titolo) + "</span></button>" : "<span></span>") +
      (succ ? '<button data-open="' + succ.id + '"><span>' + succ.n + ". " + U.esc(succ.titolo) + "</span>" + I("dx") + "</button>" : "<span></span>") +
      "</nav></div>";
  }

  function aggiornaCuori(el, v) {
    var cuoriEl = el.querySelectorAll(".star");
    cuoriEl.forEach(function (h, idx) {
      var i = idx + 1;
      h.classList.toggle("full", v != null && v >= i);
      h.classList.toggle("half", v != null && v < i && v >= i - 0.5);
    });
    var box = el.closest(".rating");
    var val = box.querySelector(".rating-value");
    val.innerHTML = v == null ? '<b class="none">—</b>' : '<b class="num">' + U.fmtVoto(v) + "</b><small>/ 10</small>";
    box.querySelector("[data-parola]").textContent = U.parolaVoto(v);
    el.setAttribute("aria-valuenow", v == null ? 0 : v);
    el.setAttribute("aria-valuetext", v == null ? "Nessun voto" : U.fmtVoto(v) + " su 10, " + U.parolaVoto(v));
    var conf = box.querySelector("[data-conferma-voto]");
    if (conf) conf.disabled = v == null;
    var st = box.querySelector("[data-stato-voto]");
    if (st && aperto) st.innerHTML = statoVoto(EN.progressi.di(aperto));
  }

  function impostaBozza(el, v) {
    bozza = v;
    aggiornaCuori(el, v);
  }

  function valoreDa(el, x) {
    var r = el.getBoundingClientRect();
    var frazione = U.clamp((x - r.left) / r.width, 0, 1);
    return U.clamp(Math.ceil(frazione * 20) / 2, 1, 10);
  }

  function collegaCuori(panel, t) {
    var el = panel.querySelector(".stars");
    if (!el) return;
    var trascina = false, prima = null;
    el.addEventListener("pointerdown", function (e) {
      trascina = true;
      prima = bozza;
      try { el.setPointerCapture(e.pointerId); } catch (x) { /* ok */ }
      impostaBozza(el, valoreDa(el, e.clientX));
    });
    el.addEventListener("pointermove", function (e) {
      if (!trascina) return;
      var v = valoreDa(el, e.clientX);
      if (v !== bozza) impostaBozza(el, v);
    });
    el.addEventListener("pointerup", function () { trascina = false; });
    el.addEventListener("pointercancel", function () {
      trascina = false;
      impostaBozza(el, prima);
    });
    el.addEventListener("keydown", function (e) {
      var v = bozza != null ? bozza : EN.progressi.voto(t.id);
      var base = v == null ? 5 : v;
      var map = { ArrowRight: 0.5, ArrowUp: 0.5, ArrowLeft: -0.5, ArrowDown: -0.5 };
      if (map[e.key] != null) { e.preventDefault(); e.stopPropagation(); impostaBozza(el, U.clamp(base + map[e.key], 1, 10)); }
      if (e.key === "Home") { e.preventDefault(); impostaBozza(el, 1); }
      if (e.key === "End") { e.preventDefault(); impostaBozza(el, 10); }
      if (e.key === "Enter") { e.preventDefault(); conferma(t); }
    });
  }

  /* «Conferma voto»: salva (se è cambiato) e chiude la scheda */
  function conferma(t) {
    var salvato = EN.progressi.voto(t.id);
    var v = bozza != null ? bozza : salvato;
    if (v == null) return;
    if (v === salvato) { chiudi(); EN.ui.avviso("Voto confermato: " + U.fmtVoto(v) + " · " + U.parolaVoto(v)); return; }
    EN.progressi.impostaVoto(t.id, v).then(function () {
      chiudi();
      EN.ui.avviso("Voto salvato: " + U.fmtVoto(v) + " · " + U.parolaVoto(v));
    }).catch(function () {});
  }

  function render() {
    if (!aperto) return;
    var t = EN.stats.perId(aperto);
    var panel = radice.querySelector(".sheet-panel");
    var scroll = panel ? panel.scrollTop : 0;
    if (!panel) {
      radice.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">' +
        '<div class="sheet-backdrop" data-close></div><div class="sheet-panel" tabindex="-1"></div></div>';
      panel = radice.querySelector(".sheet-panel");
    }
    panel.innerHTML = contenuto(t);
    panel.scrollTop = scroll;
    collegaCuori(panel, t);
  }

  function apri(id) {
    if (!EN.stats.perId(id)) return;
    if (!aperto) ultimoFocus = document.activeElement;
    var cambio = aperto && aperto !== id;
    if (aperto !== id) bozza = null;
    aperto = id;
    radice.hidden = false;
    document.documentElement.style.overflow = "hidden";
    if (cambio) { var p = radice.querySelector(".sheet-panel"); if (p) p.scrollTop = 0; }
    render();
    var panel = radice.querySelector(".sheet-panel");
    if (!cambio) panel.focus({ preventScroll: true });
  }

  function chiudi() {
    if (!aperto) return;
    aperto = null;
    bozza = null;
    radice.innerHTML = "";
    radice.hidden = true;
    document.documentElement.style.overflow = "";
    if (ultimoFocus && ultimoFocus.focus && document.contains(ultimoFocus)) ultimoFocus.focus({ preventScroll: true });
  }

  function inizializza(el) {
    radice = el;
    radice.hidden = true;
    radice.addEventListener("click", function (e) {
      var b;
      if (e.target.closest("[data-close]")) { chiudi(); return; }
      if ((b = e.target.closest("[data-open]"))) { apri(b.getAttribute("data-open")); return; }
      var t = EN.stats.perId(aperto);
      if (!t) return;
      if ((b = e.target.closest("[data-seen]"))) {
        EN.ui.app.segnaVisto(t, b.getAttribute("data-seen") === "1");
        return;
      }
      if ((b = e.target.closest("[data-step]"))) {
        var v = bozza != null ? bozza : EN.progressi.voto(t.id);
        var passo = parseFloat(b.getAttribute("data-step"));
        impostaBozza(radice.querySelector(".stars"), U.clamp((v == null ? (passo > 0 ? 7 : 6.5) : v + passo), 1, 10));
        return;
      }
      if (e.target.closest("[data-conferma-voto]")) { conferma(t); return; }
      if (e.target.closest("[data-del-voto]")) {
        var vecchio = EN.progressi.voto(t.id);
        bozza = null;
        EN.progressi.rimuoviVoto(t.id).then(function () {
          EN.ui.avviso("Voto eliminato", { azione: { testo: "Annulla", fn: function () { EN.progressi.impostaVoto(t.id, vecchio); } } });
        }).catch(function () {});
      }
    });
    document.addEventListener("keydown", function (e) {
      if (!aperto) return;
      if (e.key === "Escape") chiudi();
      var t = EN.stats.perId(aperto);
      if (e.target.closest && e.target.closest(".stars")) return;
      if (e.key === "ArrowRight" && EN.catalogo.titoli[t.n]) apri(EN.catalogo.titoli[t.n].id);
      if (e.key === "ArrowLeft" && EN.catalogo.titoli[t.n - 2]) apri(EN.catalogo.titoli[t.n - 2].id);
    });
    EN.progressi.ascolta(function () { if (aperto) render(); });
  }

  return { inizializza: inizializza, apri: apri, chiudi: chiudi, aperto: function () { return aperto; } };
})();

</script>
<script data-modulo="ui/sigla.js">
/* ==========================================================================
   EleNetflix · SIGLA D'APERTURA
   Dopo la password: fasci di luce rossi che convergono, il logo che si mette
   a fuoco e un'entrata nello schermo. Suono originale generato al momento
   (Web Audio): parte solo perché segue il tocco su «Entra».
   Un tocco salta tutto. Con «riduci movimento» i fasci spariscono.
   ========================================================================== */
window.EN = window.EN || {};
EN.ui = EN.ui || {};

EN.ui.sigla = (function () {
  var K_SUONO = "elenetflix:suono";
  var DURATA_LOGO = 3450;          /* fine dell'entrata del logo (ms), in linea con sigla.css */
  var ctx = null;

  function suonoAttivo() { try { return localStorage.getItem(K_SUONO) !== "0"; } catch (e) { return true; } }
  function impostaSuono(on) { try { localStorage.setItem(K_SUONO, on ? "1" : "0"); } catch (e) { /* ok */ } }

  /* va chiamata dentro il tocco dell'utente: sblocca l'audio sui telefoni */
  function prepara() {
    if (!suonoAttivo()) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!ctx) ctx = new AC();
      if (ctx.state === "suspended") ctx.resume();
      /* un istante di silenzio sblocca iOS */
      var b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource();
      s.buffer = b; s.connect(ctx.destination); s.start(0);
    } catch (e) { ctx = null; }
  }

  function suona() {
    if (!ctx || !suonoAttivo()) return;
    try {
      var t0 = ctx.currentTime + 0.03;
      var master = ctx.createGain();
      master.gain.value = 0.85;
      var comp = ctx.createDynamicsCompressor();
      master.connect(comp); comp.connect(ctx.destination);

      /* 1 · fruscio che sale mentre i fasci si accendono */
      var dur = 1.05, n = Math.floor(ctx.sampleRate * dur);
      var buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1);
      var rumore = ctx.createBufferSource(); rumore.buffer = buf;
      var bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.2;
      bp.frequency.setValueAtTime(300, t0); bp.frequency.exponentialRampToValueAtTime(4200, t0 + dur);
      var gr = ctx.createGain();
      gr.gain.setValueAtTime(0.0001, t0); gr.gain.exponentialRampToValueAtTime(0.35, t0 + dur * 0.9); gr.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      rumore.connect(bp); bp.connect(gr); gr.connect(master);
      rumore.start(t0); rumore.stop(t0 + dur);

      /* 2 · colpo profondo quando il logo va a fuoco */
      var tc = t0 + 1.0;
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(92, tc); o.frequency.exponentialRampToValueAtTime(34, tc + 2.3);
      g.gain.setValueAtTime(0.0001, tc); g.gain.exponentialRampToValueAtTime(1, tc + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, tc + 3.1);
      o.connect(g); g.connect(master); o.start(tc); o.stop(tc + 3.2);

      /* 3 · accordo luminoso che si apre (re minore con nona) */
      [146.83, 220, 293.66, 349.23, 659.25].forEach(function (f, k) {
        var os = ctx.createOscillator(), gg = ctx.createGain();
        os.type = k < 2 ? "sawtooth" : "triangle";
        os.frequency.setValueAtTime(f, tc);
        os.detune.setValueAtTime((k % 2 ? 6 : -6), tc);
        var lp = ctx.createBiquadFilter(); lp.type = "lowpass";
        lp.frequency.setValueAtTime(600, tc); lp.frequency.exponentialRampToValueAtTime(3200, tc + 1.8);
        var picco = k < 2 ? 0.06 : 0.05;
        gg.gain.setValueAtTime(0.0001, tc); gg.gain.exponentialRampToValueAtTime(picco, tc + 0.65); gg.gain.exponentialRampToValueAtTime(0.0001, tc + 3.4);
        os.connect(lp); lp.connect(gg); gg.connect(master);
        os.start(tc); os.stop(tc + 3.5);
      });
    } catch (e) { /* senza audio la sigla resta comunque */ }
  }

  function fasci() {
    var colori = ["#e2132f", "#ff3d52", "#b30f26", "#ff7a8a", "#e2132f", "#7a0614", "#ff3d52", "#c41430", "#ff5a6b", "#e2132f", "#9e0c22", "#ff3d52"];
    var h = "";
    for (var i = 0; i < colori.length; i++) {
      var x = ((i + 0.5) / colori.length - 0.5) * 100;      /* distanza dal centro, in % */
      var w = [3, 1.2, 5, 0.8, 2.2, 6, 1.5, 3.5, 0.9, 4, 2.6, 1.1][i];
      h += '<span class="sg-beam" style="--x:' + x.toFixed(1) + 'vw;--w:' + w + 'vw;--c:' + colori[i] + ';--d:' + (Math.abs(x) * 0.0052).toFixed(3) + 's"></span>';
    }
    return h;
  }

  function avvia(fine) {
    var ridotto = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    var el = document.createElement("div");
    el.className = "sigla" + (ridotto ? " sigla-ridotta" : "");
    el.setAttribute("aria-hidden", "true");
    el.innerHTML = '<div class="sg-beams">' + fasci() + "</div>" +
      '<div class="sg-glow"></div>' +
      '<div class="sg-logo">' + EN.ui.logo() + "</div>";
    document.body.appendChild(el);
    suona();

    var chiusa = false;
    function chiudi() {
      if (chiusa) return;
      chiusa = true;
      el.classList.add("sg-fine");
      setTimeout(function () { el.remove(); }, 450);
      if (fine) fine();
    }

    el.addEventListener("click", chiudi);
    setTimeout(chiudi, ridotto ? 1400 : DURATA_LOGO);
  }

  return { prepara: prepara, avvia: avvia, suonoAttivo: suonoAttivo, impostaSuono: impostaSuono };
})();

</script>
<script data-modulo="ui/installa.js">
/* ==========================================================================
   EleNetflix · INSTALLAZIONE COME APP
   Solo sul sito pubblicato (window.EN_SITO). Su Android il browser offre
   l'installazione vera e propria; su iPhone si aggiunge alla schermata Home.
   ========================================================================== */
window.EN = window.EN || {};
EN.ui = EN.ui || {};

EN.ui.installa = (function () {
  var K_NASCOSTA = "elenetflix:install:nascosta";
  var richiesta = null;
  var ascoltatori = [];

  function notifica() { ascoltatori.forEach(function (fn) { try { fn(); } catch (e) { /* ok */ } }); }

  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); richiesta = e; notifica(); });
  window.addEventListener("appinstalled", function () { richiesta = null; nascondi(); notifica(); });

  function standalone() {
    return (window.matchMedia && (matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches)) || window.navigator.standalone === true;
  }
  function iphone() {
    var ua = navigator.userAgent || "";
    return /iphone|ipad|ipod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }
  function nascosta() { try { return localStorage.getItem(K_NASCOSTA) === "1"; } catch (e) { return false; } }
  function nascondi() { try { localStorage.setItem(K_NASCOSTA, "1"); } catch (e) { /* ok */ } }
  function disponibile() { return !!window.EN_SITO && !standalone(); }

  function passi() {
    if (iphone()) {
      return '<ol class="install-passi"><li>Apri questa pagina con <b>Safari</b>.</li>' +
        "<li>Tocca <b>Condividi</b> (il quadrato con la freccia in su).</li>" +
        "<li>Scegli <b>Aggiungi alla schermata Home</b>, poi <b>Aggiungi</b>.</li></ol>";
    }
    return '<ol class="install-passi"><li>Apri il menu del browser <b>⋮</b> in alto a destra.</li>' +
      "<li>Tocca <b>Installa app</b> (o <b>Aggiungi a schermata Home</b>).</li>" +
      "<li>Conferma: l'icona di EleNetflix compare tra le app.</li></ol>";
  }

  function scheda(forza) {
    if (!disponibile() || (!forza && nascosta())) return "";
    var I = EN.ui.icona;
    return '<section class="install-card" aria-labelledby="inst-h">' +
      '<img src="icons/icon-192-v2.png" alt="" width="56" height="56">' +
      '<div><b id="inst-h">Installa EleNetflix sul telefono</b><p>Un\'icona tutta sua, a schermo intero, come una vera app.</p></div>' +
      '<button class="chiudi" data-installa-chiudi aria-label="Nascondi">' + I("chiudi") + "</button>" +
      (richiesta
        ? '<div class="azioni"><button class="btn btn-red btn-small" data-installa>' + I("scarica") + "Installa l'app</button></div>"
        : passi()) +
      "</section>";
  }

  function avvia() {
    if (!richiesta) return Promise.resolve(false);
    var r = richiesta;
    r.prompt();
    return r.userChoice.then(function (scelta) {
      richiesta = null;
      notifica();
      return scelta && scelta.outcome === "accepted";
    });
  }

  return { disponibile: disponibile, scheda: scheda, avvia: avvia, nascondi: nascondi, ascolta: function (fn) { ascoltatori.push(fn); }, standalone: standalone };
})();

</script>
<script data-modulo="ui/views/home.js">
/* ==========================================================================
   EleNetflix · HOME
   Hero "Road to Doomsday", avanzamento, prossimo titolo, file di copertine.
   ========================================================================== */
window.EN = window.EN || {};
EN.viste = EN.viste || {};

EN.viste.home = (function () {
  var U = EN.util, I = EN.ui.icona;
  var fx = null;

  function frase(giorni) {
    if (giorni > 1) return "Mancano <b class=\"num\">" + giorni + "</b> giorni ad Avengers: Doomsday";
    if (giorni === 1) return "Manca <b>1</b> giorno ad Avengers: Doomsday";
    if (giorni === 0) return "Oggi esce Avengers: Doomsday";
    return "Avengers: Doomsday è al cinema dal 16 dicembre";
  }

  function muro() {
    var scelti = [5, 9, 17, 21, 31, 15, 12, 7, 25, 39, 30, 38, 23, 1, 32, 18, 14, 37, 27, 20];
    var cat = EN.catalogo.titoli, cols = "";
    for (var c = 0; c < 5; c++) {
      var col = "";
      for (var r = 0; r < 4; r++) col += EN.ui.copertina(cat[scelti[c * 4 + r] - 1], { decorativa: true });
      cols += '<div class="col">' + col + "</div>";
    }
    return '<div class="hero-wall" aria-hidden="true">' + cols + "</div>";
  }

  function hero() {
    return '<section class="hero" aria-labelledby="hero-title">' +
      '<div class="hero-glow"></div>' + muro() + '<canvas class="hero-fx" aria-hidden="true"></canvas><div class="hero-shade"></div>' +
      '<div class="hero-content">' +
      '<p class="eyebrow">Maratona Marvel · 40 titoli</p>' +
      '<h1 class="hero-title" id="hero-title"><span class="ht-a">ROAD TO</span><span class="ht-b">DOOMSDAY</span></h1>' +
      '<p class="hero-sub">40 storie. Un\'unica grande avventura.</p>' +
      '<p class="hero-count"><span class="dot"></span><span>' + frase(U.giorniA(EN.config.dataObiettivo)) + "</span></p>" +
      '<div class="hero-actions">' +
      '<button class="btn btn-primary" data-continua>Continua la maratona ▶</button>' +
      '<button class="btn btn-ghost" data-go="maratona">' + I("info") + "Esplora i film</button>" +
      "</div></div></section>";
  }

  function avanzamento(r, prossimo) {
    var giorni = U.giorniA(EN.config.dataObiettivo);
    var ritmo = "";
    if (r.rimanenti > 0 && giorni > 0) {
      var sett = r.rimanenti / (giorni / 7);
      ritmo = "<span>Ritmo necessario: <b>" + (Math.round(sett * 10) / 10).toString().replace(".", ",") + "</b> titoli a settimana</span>";
    }
    var pos = Math.min(100, Math.max(0, r.percentuale));
    return '<div class="progress-card">' +
      '<div class="progress-top"><div class="progress-count num">' + r.completati + " <small>/ " + r.totale + "</small></div>" +
      '<div class="progress-pct num">' + r.percentuale + "%</div></div>" +
      '<div class="bar" role="progressbar" aria-label="Avanzamento della maratona" aria-valuemin="0" aria-valuemax="' + r.totale + '" aria-valuenow="' + r.completati + '">' +
      '<div class="bar-fill" style="width:' + pos + '%"></div><div class="bar-ticks"></div>' +
      '<span class="bar-dot" style="left:' + pos + '%"></span></div>' +
      '<div class="progress-meta"><span><b>' + r.completati + " / " + r.totale + "</b> titoli completati</span>" +
      "<span><b>" + r.percentuale + "%</b> del viaggio completato</span>" + ritmo + "</div></div>";
  }

  function prossimoCard(t) {
    var p = EN.progressi.di(t.id);
    var finale = !!t.finale;
    var bloccato = EN.ui.bloccato(t);
    return '<article class="next-card" data-saga="' + t.saga + '">' +
      '<button data-open="' + t.id + '" aria-label="Apri la scheda di ' + U.esc(t.titolo) + '" style="align-self:start">' + EN.ui.copertina(t, { decorativa: true }) + "</button>" +
      '<div class="next-body">' +
      '<span class="eyebrow">' + (finale ? "40 su 40 · Gran finale" : "N° " + t.n + " · " + U.etichettaTipo(t)) + "</span>" +
      '<h3 class="next-title">' + U.esc(t.titolo) + "</h3>" +
      '<div class="next-meta"><span class="pill">' + t.anno + "</span>" +
      (t.rt != null ? '<span class="pill pill-tomato">🍅 Rotten Tomatoes: ' + t.rt + "%</span>" : '<span class="pill">🍅 Non ancora disponibile</span>') + "</div>" +
      '<p class="next-plot">' + U.esc(t.trama) + "</p>" +
      '<div class="next-actions"><button class="btn btn-red btn-small" data-open="' + t.id + '">Apri scheda</button>' +
      (!bloccato && !p.visto ? '<button class="btn btn-line btn-small" data-toggle-seen="' + t.id + '">' + I("check") + "Visto</button>" : "") +
      "</div></div></article>";
  }

  function dinamica() {
    var r = EN.stats.riepilogo();
    var prossimo = EN.stats.prossimo();
    var cat = EN.catalogo.titoli;
    var prep = EN.stats.preparatori();
    var finale = EN.stats.finale();
    var visti = cat.filter(function (t) { return EN.progressi.visto(t.id); });
    var pref = EN.stats.preferiti();

    var html = EN.ui.installa.scheda() + '<section class="home-block" aria-labelledby="h-maratona">' +
      '<div class="sec-head"><h2 class="sec-title" id="h-maratona">Avanzamento</h2><button class="sec-more" data-go="maratona">Ordine di visione ›</button></div>' +
      avanzamento(r, prossimo) + "</section>";

    html += '<section class="home-block" aria-labelledby="h-next"><div class="sec-head"><h2 class="sec-title" id="h-next">▶ Prossimo titolo</h2></div>' +
      prossimoCard(prossimo) + "</section>";

    html += EN.ui.fila({ chiave: "tutta", titolo: "🎬 Tutta la maratona", vai: "maratona", stato: "tutti",
      contenuto: prep.map(function (t) { return EN.ui.carta(t, { prossimo: t.id === prossimo.id }); }).join("") + EN.ui.cartaFinale(finale) });

    html += EN.ui.fila({ chiave: "visti", titolo: "✓ Già visti", vai: visti.length ? "visti" : null,
      contenuto: visti.length
        ? visti.map(function (t) { return EN.ui.carta(t); }).join("")
        : EN.ui.vuoto("Nessun titolo visto", "Si parte da Spider-Man (2002). I titoli segnati come visti compaiono qui.",
          '<button class="btn btn-red btn-small" data-continua style="justify-self:start">' + I("play") + "Inizia</button>") });

    html += EN.ui.fila({ chiave: "critica", titolo: "🏆 I più apprezzati dalla critica",
      contenuto: EN.stats.perRT().map(function (t) { return EN.ui.carta(t); }).join("") });

    html += EN.ui.fila({ chiave: "preferiti", titolo: "⭐ I voti più alti", vai: pref.length ? "voti" : null,
      contenuto: pref.length
        ? pref.map(function (t) { return EN.ui.carta(t); }).join("")
        : EN.ui.vuoto("Nessun voto", "Apri un titolo e assegna da 1 a 10 stelle: qui compare la classifica.") });

    html += '<p class="credits wrap home-credits">Locandine: <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a>. ' + U.esc(EN.tmdb.attribuzione) + "</p>";
    return html;
  }

  /* ---------- scintille sullo sfondo dell'hero (leggere, si fermano fuori schermo) ---------- */
  function avviaFx(root) {
    var canvas = root.querySelector(".hero-fx");
    if (!canvas || !canvas.getContext) return null;
    var ctx = canvas.getContext("2d");
    var ridotto = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var w = 0, h = 0, punti = [], raf = 0, visibile = true, vivo = true;

    function dimensiona() {
      var r = canvas.getBoundingClientRect();
      w = r.width; h = r.height;
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function nuovo(iniziale) {
      return {
        x: Math.random() * w, y: iniziale ? Math.random() * h : h + 10,
        r: Math.random() * 1.8 + .4, v: Math.random() * .35 + .12,
        d: (Math.random() - .5) * .25, a: Math.random() * .6 + .25,
        c: Math.random() < .72 ? "255,80,92" : Math.random() < .5 ? "244,200,107" : "94,230,160",
        f: Math.random() * Math.PI * 2
      };
    }
    function disegna() {
      ctx.clearRect(0, 0, w, h);
      for (var i = 0; i < punti.length; i++) {
        var p = punti[i];
        if (!ridotto) { p.y -= p.v; p.x += p.d + Math.sin(p.f += .01) * .15; }
        if (p.y < -10) punti[i] = p = nuovo(false);
        var alpha = p.a * (0.55 + 0.45 * Math.sin(p.f * 3)) * Math.min(1, p.y / (h * .35));
        alpha = Math.max(0, alpha);
        ctx.beginPath();
        ctx.fillStyle = "rgba(" + p.c + "," + (alpha * .22).toFixed(3) + ")";
        ctx.arc(p.x, p.y, p.r * 3.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath();
        ctx.fillStyle = "rgba(" + p.c + "," + alpha.toFixed(3) + ")";
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      }
    }
    function ciclo() {
      if (!vivo) return;
      if (visibile && !document.hidden) disegna();
      raf = requestAnimationFrame(ciclo);
    }
    dimensiona();
    for (var i = 0; i < 70; i++) punti.push(nuovo(true));
    if (ridotto) disegna(); else raf = requestAnimationFrame(ciclo);

    var io = "IntersectionObserver" in window ? new IntersectionObserver(function (e) { visibile = e[0].isIntersecting; }) : null;
    if (io) io.observe(canvas);
    var onResize = function () { dimensiona(); if (ridotto) disegna(); };
    window.addEventListener("resize", onResize);
    return function stop() { vivo = false; cancelAnimationFrame(raf); if (io) io.disconnect(); window.removeEventListener("resize", onResize); };
  }

  return {
    titolo: "Home",
    render: function () {
      return '<div class="view enter" data-view="home">' + hero() + '<div id="home-dyn">' + dinamica() + "</div></div>";
    },
    dopo: function (root, prima) {
      if (fx) fx();
      fx = avviaFx(root);
      if (prima) {
        var sc = root.querySelector('[data-row="tutta"]');
        var nx = sc && sc.querySelector(".is-next");
        if (sc && nx && nx.offsetLeft > sc.clientWidth * .6) sc.scrollLeft = nx.offsetLeft - 16;
      }
    },
    aggiorna: function (root) {
      var el = root.querySelector("#home-dyn");
      if (el) el.innerHTML = dinamica();
    },
    lascia: function () { if (fx) { fx(); fx = null; } }
  };
})();

</script>
<script data-modulo="ui/views/elenchi.js">
/* ==========================================================================
   EleNetflix · LA NOSTRA MARATONA · DA VEDERE · GIÀ VISTI · LE MIE VALUTAZIONI
   ========================================================================== */
window.EN = window.EN || {};
EN.viste = EN.viste || {};

(function () {
  var U = EN.util, I = EN.ui.icona;

  /* ======================= LA NOSTRA MARATONA ======================= */
  var filtri = { ricerca: "", stato: "tutti", tipo: "tutti", ordine: "maratona" };

  function chip(gruppo, valore, testo) {
    return '<button class="chip" data-filtro="' + gruppo + '" data-valore="' + valore + '" aria-pressed="' + (filtri[gruppo] === valore) + '">' + testo + "</button>";
  }

  function voceElenco(t) {
    var p = EN.progressi.di(t.id);
    var bloccato = EN.ui.bloccato(t);
    var meta = [t.anno, U.etichettaTipo(t)];
    return '<li class="item' + (p.visto ? " is-seen" : "") + (t.finale ? " is-finale" : "") + '" data-id="' + t.id + '">' +
      '<button class="item-main" data-open="' + t.id + '">' +
      '<span class="item-n num">' + (t.finale ? "★" : t.n) + "</span>" +
      '<span class="item-thumb">' + EN.ui.copertina(t, { decorativa: true }) + "</span>" +
      '<span class="item-body"><span class="item-title">' + U.esc(t.titolo) + "</span>" +
      '<span class="item-meta"><span>' + meta.join(" · ") + "</span>" +
      (t.rt != null ? "<span>🍅 " + t.rt + "%</span>" : "<span>🍅 n.d.</span>") +
      (p.voto != null ? '<span class="v">★ ' + U.fmtVoto(p.voto) + "</span>" : "") +
      "</span></span></button>" +
      (bloccato
        ? '<span class="item-check" aria-label="Si sblocca il 16 dicembre" title="Si sblocca il 16 dicembre">' + I("lucchetto") + "</span>"
        : '<button class="item-check" data-toggle-seen="' + t.id + '" aria-pressed="' + !!p.visto + '" aria-label="' + (p.visto ? "Segna come non visto: " : "Segna come visto: ") + U.esc(t.titolo) + '">' + I("check") + "</button>") +
      "</li>";
  }

  function testoConta(lista) {
    var conFinale = lista.some(function (t) { return t.finale; });
    var n = lista.length - (conFinale ? 1 : 0);
    var conta = (n === 1 ? "1 titolo" : n + " titoli") + (conFinale ? " + il gran finale" : "");
    if (!n && conFinale) conta = "Il gran finale";
    return lista.length ? conta + (filtri.ordine !== "maratona" ? " · ordine alternativo" : " · in ordine di visione") : conta;
  }

  function elenco(lista) {
    lista = lista || EN.stats.filtra(filtri);
    if (!lista.length) {
      return '<p class="result-count" style="margin:0 0 10px">' + testoConta(lista) + "</p>" +
        '<div class="empty"><b>Nessun titolo trovato</b><span>Prova con un\'altra parola o togli qualche filtro.</span>' +
        '<button class="btn btn-line btn-small" data-azzera-filtri>Mostra tutti i titoli</button></div>';
    }
    return '<p class="result-count" style="margin:0 0 10px">' + testoConta(lista) + "</p>" +
      '<ol class="list">' + lista.map(voceElenco).join("") + "</ol>";
  }

  /* Aggiornamento sul posto: ogni riga si rifà, ma la copertina (con la locandina già caricata)
     viene spostata dalla riga vecchia alla nuova, così le immagini non si ricaricano. */
  function aggiornaElenco(el) {
    var lista = EN.stats.filtra(filtri);
    var ol = el.querySelector("ol.list");
    if (!ol || !lista.length) { el.innerHTML = elenco(lista); return; }
    var vecchie = {};
    Array.prototype.forEach.call(ol.children, function (li) { vecchie[li.getAttribute("data-id")] = li; });
    var attivo = document.activeElement;
    var fuoco = attivo && ol.contains(attivo) && attivo.hasAttribute("data-toggle-seen") ? attivo.getAttribute("data-toggle-seen") : null;
    var tpl = document.createElement("template");
    var dopo = null;
    lista.forEach(function (t) {
      tpl.innerHTML = voceElenco(t);
      var nuova = tpl.content.firstElementChild;
      var vecchia = vecchie[t.id];
      if (vecchia) {
        var cop = vecchia.querySelector(".item-thumb");
        if (cop) nuova.querySelector(".item-thumb").replaceWith(cop);
        delete vecchie[t.id];
        vecchia.replaceWith(nuova);
      }
      /* ordine: subito dopo la riga precedente (o in testa) */
      var rif = dopo ? dopo.nextSibling : ol.firstChild;
      if (nuova !== rif) ol.insertBefore(nuova, rif);
      dopo = nuova;
    });
    Object.keys(vecchie).forEach(function (id) { vecchie[id].remove(); });
    var c = el.querySelector(".result-count");
    if (c) c.textContent = testoConta(lista);
    if (fuoco) { var b = ol.querySelector('[data-toggle-seen="' + fuoco + '"]'); if (b) b.focus({ preventScroll: true }); }
  }

  EN.viste.maratona = {
    titolo: "Da vedere",
    filtri: filtri,
    render: function () {
      var r = EN.stats.riepilogo();
      return '<div class="view view-pad enter" data-view="maratona"><div class="wrap">' +
        '<header class="page-head"><span class="eyebrow">Ordine di visione</span><h1 class="page-title">Da vedere</h1>' +
        '<p class="page-sub">' + r.completati + " / " + r.totale + " completati. Tocca il cerchio a destra per segnare un titolo come visto.</p></header>" +
        '<div class="tools">' +
        '<div class="search">' + I("cerca") +
        '<label class="sr" for="cerca-titolo">Cerca un titolo</label>' +
        '<input id="cerca-titolo" type="search" placeholder="Cerca un titolo, es. Loki o 2019" autocomplete="off" autocapitalize="none" spellcheck="false" value="' + U.esc(filtri.ricerca) + '">' +
        '<button class="clear" data-pulisci aria-label="Cancella la ricerca"' + (filtri.ricerca ? "" : " hidden") + ">" + I("chiudi") + "</button></div>" +
        '<div class="chips" role="group" aria-label="Filtri">' +
        chip("stato", "tutti", "Tutti") + chip("stato", "davedere", "Da vedere") + chip("stato", "visti", "Già visti") +
        '<span class="chip-sep" aria-hidden="true"></span>' +
        chip("tipo", "tutti", "Film e serie") + chip("tipo", "film", "Solo film") + chip("tipo", "serie", "Solo serie TV") +
        "</div>" +
        '<div class="sortbar"><div class="select"><label class="sr" for="ordina">Ordina per</label>' +
        '<select id="ordina">' +
        '<option value="maratona"' + (filtri.ordine === "maratona" ? " selected" : "") + ">Ordine della maratona</option>" +
        '<option value="anno"' + (filtri.ordine === "anno" ? " selected" : "") + ">Anno di uscita</option>" +
        '<option value="rt"' + (filtri.ordine === "rt" ? " selected" : "") + ">Rotten Tomatoes</option>" +
        '<option value="voto"' + (filtri.ordine === "voto" ? " selected" : "") + ">Il mio voto</option>" +
        "</select>" + I("giu") + "</div>" +
        (filtri.ordine !== "maratona" ? '<button class="btn btn-line btn-small" data-ripristina>↺ Ripristina ordine di visione</button>' : "") +
        "</div></div>" +
        '<div id="m-elenco">' + elenco() + "</div></div></div>";
    },
    aggiorna: function (root) {
      var el = root.querySelector("#m-elenco");
      if (el) aggiornaElenco(el);
      var sub = root.querySelector(".page-sub");
      var r = EN.stats.riepilogo();
      if (sub) sub.textContent = r.completati + " / " + r.totale + " completati. Tocca il cerchio a destra per segnare un titolo come visto.";
    },
    collega: function (root, rirendi) {
      var input = root.querySelector("#cerca-titolo");
      var pulisci = root.querySelector("[data-pulisci]");
      input.addEventListener("input", function () {
        filtri.ricerca = input.value;
        pulisci.hidden = !input.value;
        EN.viste.maratona.aggiorna(root);
      });
      pulisci.addEventListener("click", function () {
        input.value = ""; filtri.ricerca = ""; pulisci.hidden = true;
        EN.viste.maratona.aggiorna(root); input.focus();
      });
      root.querySelector("#ordina").addEventListener("change", function (e) {
        filtri.ordine = e.target.value; rirendi();
      });
      root.addEventListener("click", function (e) {
        var b = e.target.closest("[data-filtro]");
        if (b) { filtri[b.getAttribute("data-filtro")] = b.getAttribute("data-valore"); rirendi(); return; }
        if (e.target.closest("[data-ripristina]")) { filtri.ordine = "maratona"; rirendi(); return; }
        if (e.target.closest("[data-azzera-filtri]")) { filtri.ricerca = ""; filtri.stato = "tutti"; filtri.tipo = "tutti"; rirendi(); }
      });
    },
    focusRicerca: function (root) {
      var i = root.querySelector("#cerca-titolo");
      if (i) i.focus();
    }
  };

  /* ======================= GIÀ VISTI (griglia) ======================= */
  function griglia(lista) {
    var celle = lista.map(function (t) {
      var cella = t.finale ? EN.ui.cartaFinale(t) : EN.ui.carta(t);
      return '<div class="grid-cell">' + cella + '<div class="grid-caption"><b>' + U.esc(t.titolo) + "</b>" +
        (t.rt != null ? "🍅 " + t.rt + "%" : t.anno) + "</div></div>";
    }).join("");
    return '<div class="grid">' + celle + "</div>";
  }

  EN.viste.visti = {
    titolo: "Già visti",
    render: function () {
      var visti = EN.catalogo.titoli.filter(function (t) { return EN.progressi.visto(t.id); });
      return '<div class="view view-pad enter" data-view="visti"><div class="wrap">' +
        '<header class="page-head"><span class="eyebrow">In ordine di visione</span><h1 class="page-title">Già visti</h1>' +
        '<p class="page-sub">' + (visti.length ? visti.length + (visti.length === 1 ? " titolo visto." : " titoli visti.") : "Nessun titolo visto.") + "</p></header>" +
        (visti.length ? griglia(visti)
          : '<div class="empty"><b>Nessun titolo visto</b><span>Si parte da Spider-Man (2002). Dopo averlo visto, tocca «Segna come visto» nella scheda o il cerchio in «Da vedere».</span>' +
            '<button class="btn btn-red btn-small" data-continua>Inizia la maratona ▶</button></div>') +
        "</div></div>";
    }
  };

  /* ======================= LE MIE VALUTAZIONI ======================= */
  function miniCuori(v) {
    var h = "";
    for (var i = 1; i <= 10; i++) {
      var tipo = v >= i ? 1 : v >= i - 0.5 ? 0.5 : 0;
      h += '<span style="opacity:' + (tipo === 1 ? 1 : tipo ? .55 : .18) + '">' + I("stella") + "</span>";
    }
    return '<span class="mini-stars" aria-hidden="true">' + h + "</span>";
  }

  EN.viste.voti = {
    titolo: "Le mie valutazioni",
    render: function () {
      var lista = EN.stats.preferiti();
      var r = EN.stats.riepilogo();
      var corpo = lista.length
        ? '<div class="rate-list">' + lista.map(function (t, i) {
            return '<button class="rate-item" data-open="' + t.id + '">' +
              '<span class="rate-pos num">' + (i + 1) + "</span>" +
              '<span class="item-thumb">' + EN.ui.copertina(t, { decorativa: true }) + "</span>" +
              '<span class="rate-body"><b>' + U.esc(t.titolo) + "</b>" + miniCuori(EN.progressi.voto(t.id)) +
              '<span class="item-meta"><span>' + U.esc(U.parolaVoto(EN.progressi.voto(t.id))) + "</span></span></span>" +
              '<span class="rate-val num">' + U.fmtVoto(EN.progressi.voto(t.id)) + "</span></button>";
          }).join("") + "</div>"
        : '<div class="empty"><b>Nessun voto</b><span>Apri un titolo e tocca o trascina sulle stelle: da 1 a 10, anche con il mezzo punto.</span>' +
          '<button class="btn btn-line btn-small" data-go="visti">Vai ai titoli già visti</button></div>';
      return '<div class="view view-pad enter" data-view="voti"><div class="wrap">' +
        '<header class="page-head"><span class="eyebrow">Classifica personale</span><h1 class="page-title">Le mie valutazioni</h1>' +
        '<p class="page-sub">' + (lista.length ? lista.length + (lista.length === 1 ? " titolo votato" : " titoli votati") + " · voto medio " + U.fmtMedia(r.media) + ". Tocca un titolo per cambiare o eliminare il voto." : "Dal voto più alto al più basso.") + "</p></header>" +
        corpo + "</div></div>";
    }
  };
})();

</script>
<script data-modulo="ui/views/statistiche.js">
/* ==========================================================================
   EleNetflix · STATISTICHE + I NOSTRI DATI (backup)
   ========================================================================== */
window.EN = window.EN || {};
EN.viste = EN.viste || {};

EN.viste.stats = (function () {
  var U = EN.util, I = EN.ui.icona;
  var pannello = { modo: null, anteprima: null, errore: "", ok: "", json: "" };
  var downloads = null;

  /* capacità opzionale della pagina pubblicata: salvare un file sul dispositivo */
  try {
    if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("downloads").then(function (d) { downloads = d; }).catch(function () { downloads = null; });
    }
  } catch (e) { downloads = null; }

  function conto() {
    var g = U.giorniA(EN.config.dataObiettivo);
    var num = g > 0 ? g : g === 0 ? "0" : "✓";
    var testo = g > 1 ? "Mancano " + g + " giorni ad Avengers: Doomsday"
      : g === 1 ? "Manca 1 giorno ad Avengers: Doomsday"
      : g === 0 ? "Oggi esce Avengers: Doomsday"
      : "Avengers: Doomsday è al cinema";
    return '<div class="count-card" style="margin:0"><div class="count-num num">' + num + '</div><div class="count-txt">' + testo +
      "<small>Data obiettivo della maratona: 16 dicembre 2026</small></div></div>";
  }

  function tiles(r) {
    var pref = r.preferito, rt = r.migliorRT;
    return '<div class="tiles">' +
      '<div class="tile"><span class="tile-label">🎬 Titoli completati</span><span class="tile-value num">' + r.completati + "<small> / " + r.totale + "</small></span>" +
      '<span class="tile-note">' + r.film + (r.film === 1 ? " film" : " film") + " · " + r.serie + (r.serie === 1 ? " serie" : " serie") + (r.finaleVisto ? " · + il gran finale ✓" : "") + "</span></div>" +

      '<div class="tile" style="display:flex;align-items:center;gap:14px"><div class="ring" style="--p:' + r.percentuale + '"><span class="num">' + r.percentuale + "%</span></div>" +
      '<div style="display:grid;gap:4px;min-width:0"><span class="tile-label">📊 Avanzamento</span><span class="tile-note">del viaggio verso Doomsday</span></div></div>' +

      '<div class="tile"><span class="tile-label">⭐ Voto medio</span><span class="tile-value num" style="color:var(--gold)">' + U.fmtMedia(r.media) + "</span>" +
      '<span class="tile-note">' + (r.votati ? "su " + r.votati + (r.votati === 1 ? " titolo votato" : " titoli votati") : "Ancora nessun voto") + "</span></div>" +

      '<div class="tile"><span class="tile-label">🍿 Ancora da vedere</span><span class="tile-value num">' + r.rimanenti + "</span>" +
      '<span class="tile-note">' + (r.rimanenti ? "titoli prima del gran finale" : "Manca solo Doomsday") + "</span></div>" +

      (pref
        ? '<button class="tile" data-open="' + pref.id + '"><span class="tile-label">🏆 Film preferito</span><span class="tile-name">' + U.esc(pref.titolo) + "</span>" +
          '<span class="tile-note">★ ' + U.fmtVoto(EN.progressi.voto(pref.id)) + " / 10" + (r.parimerito ? " · a pari merito con " + r.parimerito + (r.parimerito === 1 ? " altro" : " altri") : "") + "</span></button>"
        : '<div class="tile"><span class="tile-label">🏆 Film preferito</span><span class="tile-name" style="color:var(--dim)">Da scoprire</span><span class="tile-note">Il titolo con il voto più alto</span></div>') +

      '<button class="tile" data-open="' + rt.id + '"><span class="tile-label">🍅 Migliore Rotten Tomatoes</span><span class="tile-name">' + U.esc(rt.titolo) + "</span>" +
      '<span class="tile-note">' + rt.rt + "% · " + (r.migliorRTtraVisti ? "tra quelli già visti" : "in tutto il catalogo") + "</span></button>" +
      "</div>";
  }

  function istogramma(r) {
    var max = Math.max.apply(null, r.distribuzione.concat([1]));
    var col = r.distribuzione.map(function (n, i) {
      var h = n ? Math.max(8, Math.round(n / max * 100)) : 2;
      return '<div class="histo-col"><div class="histo-bar"' + (n ? "" : " data-zero") + ' style="height:' + h + '%">' + (n ? "<span>" + n + "</span>" : "") + "</div>" +
        '<span class="histo-x">' + (i + 1) + "</span></div>";
    }).join("");
    return '<div class="tile wide" style="margin-top:10px"><span class="tile-label">I miei voti, da 1 a 10</span>' +
      (r.votati ? '<div class="histo" role="img" aria-label="Distribuzione dei voti">' + col + "</div>"
        : '<span class="tile-note">Il grafico prende vita dal primo voto.</span>') + "</div>";
  }

  function datiPanel() {
    var ad = EN.progressi.adattatore();
    var stato = '<div class="storage-state">' + I(ad.nome === "api" ? "database" : "telefono") +
      "<span><b>" + (ad.nome === "api" ? "Database condiviso attivo." : "Per ora i dati vivono solo su questo dispositivo.") + "</b> " +
      U.esc(ad.descrizione) + (ad.nome === "api" ? "" : " Voti e titoli visti non passano da un telefono all'altro: per spostarli usa il backup qui sotto. Su iPhone anche Safari e l'app sulla schermata Home hanno memorie separate. Il database condiviso arriverà con la fase 2.") +
      "</span></div>";

    var extra = "";
    if (pannello.modo === "esporta") {
      extra = '<label class="tile-label" for="json-out">Backup pronto da copiare</label>' +
        '<textarea id="json-out" readonly>' + U.esc(pannello.json) + "</textarea>" +
        '<div class="row-btns"><button class="btn btn-line btn-small" data-copia>' + I("copia") + "Copia di nuovo</button>" +
        '<button class="btn btn-line btn-small" data-chiudi-pannello>Fatto</button></div>';
    } else if (pannello.modo === "importa") {
      extra = '<label class="tile-label" for="json-in">Incolla qui il backup, oppure scegli il file</label>' +
        '<textarea id="json-in" placeholder="{ &quot;formato&quot;: &quot;elenetflix-backup&quot;, … }">' + U.esc(pannello.incollato || "") + "</textarea>" +
        '<div class="row-btns"><button class="btn btn-line btn-small" data-analizza>Controlla il backup</button>' +
        '<label class="btn btn-line btn-small" for="file-in" style="cursor:pointer">' + I("carica") + "Scegli file .json</label>" +
        '<input id="file-in" type="file" accept=".json,application/json" hidden>' +
        '<button class="btn btn-line btn-small" data-chiudi-pannello>Annulla</button></div>';
      if (pannello.anteprima) {
        var a = pannello.anteprima;
        extra += '<div class="confirm-box"><span>Nel backup ci sono <b>' + a.visti + "</b> titoli visti, <b>" + a.voti + "</b> voti" +
          (a.esportatoIl ? " (salvato il " + U.fmtData(a.esportatoIl) + ")" : "") + ". Sostituiscono i dati attuali di questo dispositivo.</span>" +
          '<div class="row-btns"><button class="btn btn-red btn-small" data-conferma-import>Sostituisci i dati</button>' +
          '<button class="btn btn-line btn-small" data-chiudi-pannello>Annulla</button></div></div>';
      }
    } else if (pannello.modo === "azzera") {
      extra = '<div class="confirm-box"><span>Vuoi cancellare <b>tutti</b> i voti e i titoli visti da questo dispositivo? Il catalogo resta com\'è. Conviene esportare un backup prima.</span>' +
        '<div class="row-btns"><button class="btn btn-red btn-small" data-conferma-azzera>' + I("cestino") + "Sì, cancella tutto</button>" +
        '<button class="btn btn-line btn-small" data-chiudi-pannello>Annulla</button></div></div>';
    }
    return '<section class="panel" id="dati" aria-labelledby="dati-h"><h2 id="dati-h">Dati e backup</h2>' + stato +
      "<p>Il backup è un piccolo file JSON con voti e titoli visti. Servirà anche per trasferire tutto nel database definitivo sul PC.</p>" +
      '<div class="row-btns"><button class="btn btn-line btn-small" data-esporta>' + I("scarica") + "Esporta backup</button>" +
      '<button class="btn btn-line btn-small" data-importa>' + I("carica") + "Importa backup</button>" +
      '<button class="btn btn-line btn-small" data-azzera>' + I("cestino") + "Azzera</button></div>" +
      (pannello.errore ? '<p class="msg-err" role="alert">' + U.esc(pannello.errore) + "</p>" : "") +
      (pannello.ok ? '<p class="msg-ok" role="status">' + U.esc(pannello.ok) + "</p>" : "") +
      extra + "</section>";
  }

  function render() {
    var r = EN.stats.riepilogo();
    return '<div class="view view-pad enter" data-view="stats"><div class="wrap">' +
      '<header class="page-head"><span class="eyebrow">Maratona</span><h1 class="page-title">Statistiche</h1></header>' +
      '<div style="display:grid;gap:10px">' + conto() + tiles(r) + "</div>" + istogramma(r) +
      datiPanel() +
      '<p class="credits">Locandine: <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a>. ' + U.esc(EN.tmdb.attribuzione) + ' Punteggi della critica: Rotten Tomatoes, verificati il 10 ottobre 2026. ' +
      "Progetto personale, non affiliato a Netflix, Marvel, Disney o Sony.</p>" +
      "</div></div>";
  }

  function copia(testo) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(testo).then(function () { return true; }, function () { return false; });
    }
    return Promise.resolve(false);
  }

  function collega(root, rirendi) {
    function set(o) { Object.assign(pannello, { errore: "", ok: "" }, o); rirendi(); }
    root.addEventListener("click", function (e) {
      var b = e.target;
      if (b.closest("[data-esporta]")) {
        /* voti e titoli visti: come file se la pagina può salvarlo, altrimenti negli appunti */
        var leggero = JSON.stringify(EN.backup.crea(), null, 2);
        var negliAppunti = function () {
          copia(leggero).then(function (ok) {
            set({ modo: "esporta", json: leggero, ok: ok ? "Backup copiato negli appunti: incollalo in una nota o in un messaggio." : "Seleziona il testo qui sotto e copialo." });
          });
        };
        if (downloads) {
          downloads.save({ filename: EN.backup.nomeFile(), data: leggero }).then(function () {
            set({ modo: null, ok: "Backup salvato sul dispositivo." });
          }).catch(function (err) {
            if (err && err.code === "declined") { set({ modo: null }); return; }
            negliAppunti();
          });
        } else {
          negliAppunti();
        }
        return;
      }
      if (b.closest("[data-copia]")) {
        copia(pannello.json).then(function (ok) {
          if (ok) EN.ui.avviso("Backup copiato");
          else { var ta = root.querySelector("#json-out"); if (ta) { ta.focus(); ta.select(); } }
        });
        return;
      }
      if (b.closest("[data-importa]")) { set({ modo: "importa", anteprima: null }); return; }
      if (b.closest("[data-azzera]")) { set({ modo: "azzera" }); return; }
      if (b.closest("[data-chiudi-pannello]")) { set({ modo: null, anteprima: null, json: "", incollato: "" }); return; }
      if (b.closest("[data-analizza]")) {
        var testo = (root.querySelector("#json-in") || {}).value || "";
        pannello.incollato = testo;
        try { set({ anteprima: EN.backup.analizza(testo) }); }
        catch (err) { set({ errore: err.message, anteprima: null }); }
        return;
      }
      if (b.closest("[data-conferma-import]")) {
        var an = pannello.anteprima;
        EN.progressi.sostituisciTutto(an.stato).then(function () {
          set({ modo: null, anteprima: null, incollato: "", ok: "Backup importato: " + an.visti + " visti, " + an.voti + " voti." });
        }).catch(function () { set({ errore: "Non sono riuscito a salvare i dati importati." }); });
        return;
      }
      if (b.closest("[data-conferma-azzera]")) {
        EN.progressi.sostituisciTutto({ titoli: {} }).then(function () {
          set({ modo: null, ok: "Dati cancellati da questo dispositivo." });
        }).catch(function () { set({ errore: "Non sono riuscito a cancellare i dati." }); });
      }
    });
    var file = root.querySelector("#file-in");
    if (file) file.addEventListener("change", function () {
      var f = file.files && file.files[0];
      if (!f) return;
      var lettore = new FileReader();
      lettore.onload = function () {
        pannello.incollato = String(lettore.result);
        try { set({ anteprima: EN.backup.analizza(String(lettore.result)) }); }
        catch (err) { set({ errore: err.message, anteprima: null }); }
      };
      lettore.onerror = function () { set({ errore: "Non riesco a leggere il file scelto." }); };
      lettore.readAsText(f);
    });
  }

  return {
    titolo: "Statistiche",
    render: render,
    collega: collega,
    lascia: function () {
      pannello = { modo: null, anteprima: null, errore: "", ok: "", json: "" };
    }
  };
})();

</script>
<script data-modulo="ui/accesso.js">
/* ==========================================================================
   EleNetflix · SCHERMATA D'INGRESSO
   La verifica vera e propria sta in EN.accesso (fase 1 dimostrativa,
   fase 2 sul server): questa è solo l'interfaccia.
   ========================================================================== */
window.EN = window.EN || {};
EN.ui = EN.ui || {};

EN.ui.ingresso = (function () {
  var U = EN.util, I = EN.ui.icona;
  var MESSAGGI = [
    "Password errata. Riprova.",
    "Password errata. Ricontrolla le lettere.",
    "Password errata. Tocca «Hai dimenticato la password?» per l'indizio."
  ];

  function muro() {
    var cat = EN.catalogo.titoli, corsie = "";
    for (var c = 0; c < 3; c++) {
      var pezzi = "";
      for (var i = 0; i < 14; i++) pezzi += EN.ui.copertina(cat[(c * 13 + i * 3) % cat.length], { decorativa: true });
      corsie += '<div class="lane">' + pezzi + pezzi + "</div>";
    }
    return '<div class="login-wall" aria-hidden="true">' + corsie + "</div>";
  }

  function mostra(radice, quandoEntra) {
    var tentativi = 0;
    radice.innerHTML = '<div class="login" role="dialog" aria-modal="true" aria-labelledby="login-t">' + muro() +
      '<form class="login-card" novalidate>' +
      EN.ui.logo() +
      '<h1 class="login-title" id="login-t">Per accedere al materiale da supereroi inserisci la password</h1>' +
      '<div class="field"><label for="pw">Password</label>' +
      '<input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" required>' +
      '<button type="button" class="eye" data-eye aria-label="Mostra la password">' + I("occhio") + "</button></div>" +
      '<p class="login-err" role="alert" aria-live="assertive"></p>' +
      '<button type="submit" class="btn btn-red">Entra in EleNetflix</button>' +
      '<button type="button" class="link-btn" data-hint aria-expanded="false" aria-controls="hint">Hai dimenticato la password?</button>' +
      '<p class="hint" id="hint" hidden></p>' +
      "</form></div>";

    var login = radice.querySelector(".login");
    var form = radice.querySelector("form");
    var input = radice.querySelector("#pw");
    var field = radice.querySelector(".field");
    var err = radice.querySelector(".login-err");
    var hint = radice.querySelector("#hint");
    var hintBtn = radice.querySelector("[data-hint]");
    var eye = radice.querySelector("[data-eye]");

    hint.textContent = EN.accesso.suggerimento;
    setTimeout(function () { try { input.focus({ preventScroll: true }); } catch (e) { /* ok */ } }, 350);

    eye.addEventListener("click", function () {
      var vis = input.type === "password";
      input.type = vis ? "text" : "password";
      eye.innerHTML = I(vis ? "occhioNo" : "occhio");
      eye.setAttribute("aria-label", vis ? "Nascondi la password" : "Mostra la password");
      input.focus();
    });

    hintBtn.addEventListener("click", function () {
      hint.hidden = !hint.hidden;
      hintBtn.setAttribute("aria-expanded", String(!hint.hidden));
    });

    input.addEventListener("input", function () { field.classList.remove("err"); err.textContent = ""; });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var valore = input.value;
      if (!valore.trim()) { err.textContent = "Scrivi la password per entrare."; field.classList.add("err"); input.focus(); return; }
      /* sblocco l'audio adesso, dentro il tocco: la sigla potrà suonare */
      if (EN.ui.sigla) EN.ui.sigla.prepara();
      EN.accesso.entra(valore).then(function (ok) {
        if (ok) {
          input.blur();
          if (EN.ui.sigla) {
            EN.ui.sigla.avvia();
            quandoEntra();
            radice.innerHTML = ""; radice.hidden = true;
          } else {
            quandoEntra();
            login.classList.add("leaving");
            setTimeout(function () { radice.innerHTML = ""; radice.hidden = true; }, 720);
          }
        } else {
          err.textContent = MESSAGGI[Math.min(tentativi, MESSAGGI.length - 1)];
          tentativi++;
          field.classList.add("err");
          form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
          input.select();
        }
      }).catch(function () {
        err.textContent = "Non riesco a verificare la password in questo momento. Riprova tra poco.";
      });
    });
  }

  return { mostra: mostra };
})();

</script>
<script data-modulo="ui/app.js">
/* ==========================================================================
   EleNetflix · APP (avvio, navigazione, intestazione, eventi globali)
   ========================================================================== */
window.EN = window.EN || {};
EN.ui = EN.ui || {};

EN.ui.app = (function () {
  var U = EN.util, I = EN.ui.icona;
  var SEZIONI = [
    { id: "home", nome: "Home", breve: "Home", icona: "home" },
    { id: "maratona", nome: "Da vedere", breve: "Da vedere", icona: "davedere" },
    { id: "visti", nome: "Già visti", breve: "Già visti", icona: "visti" },
    { id: "voti", nome: "Le mie valutazioni", breve: "Voti", icona: "voti" },
    { id: "stats", nome: "Statistiche", breve: "Statistiche", icona: "stats" }
  ];
  var vista = "home", main, topbar, avviata = false;

  function shell() {
    return '<header class="topbar"><div class="topbar-in">' +
      '<button data-go="home" aria-label="EleNetflix, torna alla home">' + EN.ui.logo() + "</button>" +
      '<nav class="topnav" aria-label="Sezioni">' + SEZIONI.map(function (s) {
        return '<button data-go="' + s.id + '">' + s.nome + "</button>";
      }).join("") + "</nav>" +
      '<div class="top-actions"><button class="icon-btn" data-cerca aria-label="Cerca un titolo">' + I("cerca") + "</button>" +
      '<button class="icon-btn" data-menu aria-label="Menu" aria-haspopup="true" aria-expanded="false"><span class="avatar">E</span></button></div>' +
      "</div></header>" +
      '<main id="main"></main>' +
      '<nav class="tabbar" aria-label="Sezioni"><div class="tabbar-in">' + SEZIONI.map(function (s) {
        return '<button class="tab" data-go="' + s.id + '">' + I(s.icona) + "<span>" + s.breve + "</span></button>";
      }).join("") + "</div></nav>" +
      '<div id="menu-root"></div>';
  }

  function aggiornaNav() {
    document.querySelectorAll("[data-go]").forEach(function (b) {
      if (b.closest(".topnav") || b.classList.contains("tab")) {
        if (b.getAttribute("data-go") === vista) b.setAttribute("aria-current", "page");
        else b.removeAttribute("aria-current");
      }
    });
    topbar.classList.toggle("solid", vista !== "home" || window.scrollY > 40);
    var s = SEZIONI.filter(function (x) { return x.id === vista; })[0];
    document.title = vista === "home" ? "EleNetflix" : s.nome + " · EleNetflix";
  }

  function salvaFile() {
    var m = {};
    main.querySelectorAll("[data-row]").forEach(function (r) { m[r.getAttribute("data-row")] = r.scrollLeft; });
    return m;
  }
  function ripristinaFile(m) {
    main.querySelectorAll("[data-row]").forEach(function (r) {
      var k = r.getAttribute("data-row");
      if (m[k] != null) r.scrollLeft = m[k];
    });
  }

  /* full = nuova sezione (animazione + scroll in alto); altrimenti aggiornamento sul posto */
  function disegna(full) {
    var V = EN.viste[vista];
    var y = window.scrollY;
    var file = full ? {} : salvaFile();
    var html = V.render();
    if (!full) html = html.replace('class="view ', 'class="view no-enter ').replace(" enter\"", "\"");
    main.innerHTML = html;
    var root = main.firstElementChild;
    if (V.collega) V.collega(root, function () { disegna(false); });
    if (V.dopo) V.dopo(root, full);
    if (full) window.scrollTo(0, 0); else { window.scrollTo(0, y); ripristinaFile(file); }
    aggiornaNav();
  }

  function vai(id, opz) {
    if (!EN.viste[id]) id = "home";
    chiudiMenu();
    if (EN.ui.scheda.aperto()) EN.ui.scheda.chiudi();
    var V = EN.viste[vista];
    if (V && V.lascia && vista !== id) V.lascia();
    vista = id;
    try { history.replaceState(null, "", "#" + id); } catch (e) { /* ok */ }
    disegna(true);
    if (opz && opz.cerca && EN.viste.maratona.focusRicerca) EN.viste.maratona.focusRicerca(main.firstElementChild);
  }

  function suCambio(evento) {
    if (evento && evento.tipo === "errore") { EN.ui.avviso(evento.messaggio, { errore: true }); }
    var V = EN.viste[vista];
    if (V.aggiorna) {
      var file = salvaFile();
      V.aggiorna(main.firstElementChild);
      ripristinaFile(file);
    } else {
      disegna(false);
    }
  }

  /* Segna / annulla "visto", con avvisi e piccole feste a ogni traguardo */
  function segnaVisto(t, visto) {
    var primaRiep = EN.stats.riepilogo();
    EN.progressi.impostaVisto(t.id, visto).then(function () {
      var r = EN.stats.riepilogo();
      if (!visto) {
        EN.ui.avviso(t.titolo + " torna tra i titoli da vedere");
        return;
      }
      var annulla = { testo: "Annulla", fn: function () { EN.progressi.impostaVisto(t.id, false); } };
      if (!t.finale && r.completati === r.totale && primaRiep.completati < r.totale) {
        EN.ui.avviso("40 su 40 completati: manca solo Doomsday", { azione: annulla, durata: 6000 });
      } else if (!t.finale && r.completati % 10 === 0 && r.completati > primaRiep.completati) {
        EN.ui.avviso(r.completati + " su 40 completati", { azione: annulla, durata: 5000 });
      } else if (t.finale) {
        EN.ui.avviso("Avengers: Doomsday segnato come visto", { azione: annulla, durata: 6000 });
      } else {
        EN.ui.avviso("✓ " + t.titolo + " segnato come visto", { azione: annulla });
      }
    }).catch(function () {});
  }

  /* ---------- menu profilo ---------- */
  function apriMenu(btn) {
    var r = document.getElementById("menu-root");
    if (r.innerHTML) { chiudiMenu(); return; }
    r.innerHTML = '<div class="menu" role="menu">' +
      '<button role="menuitem" data-go="voti">' + I("voti") + "Le mie valutazioni</button>" +
      (EN.ui.installa.disponibile() ? '<button role="menuitem" data-installa-mostra>' + I("telefono") + "Installa l'app sul telefono</button>" : "") +
      '<button role="menuitem" data-suono>' + I("play") + "Suono della sigla: " + (EN.ui.sigla.suonoAttivo() ? "acceso" : "spento") + "</button>" +
      '<button role="menuitem" data-dati="dati">' + I("database") + "Dati e backup</button>" +
      '<button role="menuitem" data-esci>' + I("esci") + "Esci da EleNetflix</button>" +
      '<div class="menu-note">' + U.esc(EN.progressi.adattatore().descrizione) + "</div></div>";
    btn.setAttribute("aria-expanded", "true");
  }
  function chiudiMenu() {
    var r = document.getElementById("menu-root");
    if (r && r.innerHTML) { r.innerHTML = ""; var b = document.querySelector("[data-menu]"); if (b) b.setAttribute("aria-expanded", "false"); }
  }

  function scorriFila(btn) {
    var sc = btn.parentElement.querySelector(".row-scroller");
    if (sc) sc.scrollBy({ left: parseInt(btn.getAttribute("data-scroll"), 10) * sc.clientWidth * .85, behavior: "smooth" });
  }

  function eventi(app) {
    app.addEventListener("click", function (e) {
      var b;
      if ((b = e.target.closest("[data-menu]"))) { apriMenu(b); return; }
      if (!e.target.closest(".menu")) chiudiMenu();
      if ((b = e.target.closest("[data-go]"))) {
        if (b.hasAttribute("data-stato")) EN.viste.maratona.filtri.stato = b.getAttribute("data-stato");
        vai(b.getAttribute("data-go"));
        return;
      }
      if ((b = e.target.closest("[data-open]")) && !b.closest("#sheet-root")) { EN.ui.scheda.apri(b.getAttribute("data-open")); return; }
      if ((b = e.target.closest("[data-toggle-seen]"))) {
        var t = EN.stats.perId(b.getAttribute("data-toggle-seen"));
        segnaVisto(t, !EN.progressi.visto(t.id));
        return;
      }
      if (e.target.closest("[data-continua]")) { EN.ui.scheda.apri(EN.stats.prossimo().id); return; }
      if (e.target.closest("[data-installa]")) {
        EN.ui.installa.avvia().then(function (ok) { if (ok) EN.ui.avviso("EleNetflix è tra le tue app"); });
        return;
      }
      if (e.target.closest("[data-installa-chiudi]")) { EN.ui.installa.nascondi(); suCambio(); return; }
      if (e.target.closest("[data-installa-mostra]")) {
        try { localStorage.removeItem("elenetflix:install:nascosta"); } catch (x) { /* ok */ }
        vai("home");
        setTimeout(function () { var c = document.querySelector(".install-card"); if (c) c.scrollIntoView({ behavior: "smooth", block: "center" }); }, 80);
        return;
      }
      if (e.target.closest("[data-suono]")) {
        var on = !EN.ui.sigla.suonoAttivo();
        EN.ui.sigla.impostaSuono(on);
        chiudiMenu();
        EN.ui.avviso("Suono della sigla " + (on ? "acceso" : "spento"));
        return;
      }
      if (e.target.closest("[data-cerca]")) { vai("maratona", { cerca: true }); return; }
      if ((b = e.target.closest("[data-scroll]"))) { scorriFila(b); return; }
      if ((b = e.target.closest("[data-dati]"))) {
        var dove = b.getAttribute("data-dati") || "dati";
        vai("stats");
        setTimeout(function () { var d = document.getElementById(dove); if (d) d.scrollIntoView({ behavior: "smooth", block: "start" }); }, 80);
        return;
      }
      if (e.target.closest("[data-esci]")) {
        EN.accesso.esci();
        var lr = document.getElementById("login-root");
        lr.hidden = false;
        EN.ui.ingresso.mostra(lr, function () { vai("home"); });
      }
    });
    window.addEventListener("scroll", function () {
      if (vista === "home") topbar.classList.toggle("solid", window.scrollY > 40);
    }, { passive: true });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") chiudiMenu(); });
  }

  function avvia() {
    if (avviata) return;
    avviata = true;
    var app = document.getElementById("app");
    app.innerHTML = shell();
    EN.ui.simboli.inserisci();
    main = document.getElementById("main");
    topbar = app.querySelector(".topbar");
    EN.ui.scheda.inizializza(document.getElementById("sheet-root"));
    eventi(app);
    EN.progressi.ascolta(suCambio);
    EN.ui.installa.ascolta(function () { if (vista === "home") suCambio(); });
    var iniziale = (location.hash || "").replace("#", "");
    if (iniziale === "davedere") iniziale = "maratona";
    vai(EN.viste[iniziale] ? iniziale : "home");
    /* chiedo al browser di non cancellare mai da solo i dati di EleNetflix */
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) { /* ok */ }
    if (EN.progressi.adattatore() && EN.progressi.adattatore().disponibile === false) {
      EN.ui.avviso("Attenzione: in questo browser voti e visti non restano salvati. Apri EleNetflix da Chrome o Safari (non in navigazione privata).", { errore: true, durata: 9000 });
    }
  }

  return { avvia: avvia, vai: vai, segnaVisto: segnaVisto };
})();

/* ---------- avvio ---------- */
(function () {
  /* titoli più grandi solo quando il carattere condensato è davvero disponibile */
  try {
    if (document.fonts && document.fonts.load) {
      Promise.all([
        document.fonts.load('900 20px "Big Shoulders"').catch(function () { return []; }),
        document.fonts.load('900 20px "Big Shoulders Display"').catch(function () { return []; })
      ]).then(function (r) {
        if ((r[0] && r[0].length) || (r[1] && r[1].length)) document.documentElement.classList.add("fonts-ok");
      });
    }
  } catch (e) { /* si resta sulle misure prudenti */ }

  function parti() {
    EN.progressi.inizializza(EN.persistenza.attiva()).catch(function () {
      return EN.progressi.inizializza(EN.persistenza.locale);
    }).then(function () {
      if (EN.accesso.giaDentro()) {
        document.getElementById("login-root").hidden = true;
        EN.ui.app.avvia();
      } else {
        EN.ui.ingresso.mostra(document.getElementById("login-root"), EN.ui.app.avvia);
      }
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", parti);
  else parti();
})();

</script>

</body></html>
